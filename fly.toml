# fly.toml app configuration file generated for ranchap on 2026-05-19T08:46:13-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ranchap'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  RANCHAPP_DB = '/data/ranch.db'

[[mounts]]
  source = 'ranchapp_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

[checks]
  [checks.http]
    port = 8080
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/auth/me'

[[restart]]
  policy = 'on-failure'
  retries = 5

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
